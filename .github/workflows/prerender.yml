name: Publicar o site (guardas + pré-render)

# O site desenha as secções em JavaScript a partir de data/*.json. O index.html
# guarda uma cópia estática desse resultado, para os rastreadores que não correm
# JS verem o conteúdo todo. Sempre que o cliente edita conteúdo no backoffice,
# essa cópia tem de ser regenerada — é isso que este workflow faz.
#
# Também converte as fotografias novas para WebP e mede as suas dimensões, sem o
# que o browser não reserva espaço e o loading="lazy" deixa de adiar nada.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'assets/img/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - '.github/scripts/**'
      # A guarda do conteúdo e as regras que ela corre (as mesmas do painel).
      - '.github/regras.mjs'
      - '.github/guardas.mjs'
      - '.github/consola.mjs'
  # Permite correr à mão a partir do separador Actions, e é o que o botão
  # «Publicar outra vez» do painel (backoffice.pokeauto.pt) dispara: sempre no
  # main, sem inputs.
  workflow_dispatch:
  schedule:
    # Ronda diária: confirma que o HTML servido continua a bater com os dados.
    # Apanha qualquer dessincronização que tenha escapado (push perdido, execução
    # falhada, edição directa no repositório).
    - cron: '17 6 * * *'

# Se o cliente gravar várias edições seguidas no backoffice, só interessa a última
concurrency:
  group: prerender
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  prerender:
    # Anti-ciclo: o commit deste workflow não pode voltar a disparar o workflow.
    # Só se aplica a `push` — num evento `schedule` o github.actor é o autor do
    # último push ao repositório, que muitas vezes É o bot, e a condição antiga
    # impedia a ronda diária de correr sempre que a última publicação tinha sido
    # automática (ou seja, quase sempre).
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # o <lastmod> do sitemap vem do histórico do git

      # A GUARDA DO CONTEÚDO, antes de tudo o que lê os dados: as regras de
      # .github/regras.mjs — as mesmas que o painel mostra por baixo dos campos e
      # que o Worker do painel confere antes de gravar. Pára só o que não se
      # pode publicar (a forma dos ficheiros, a morada, o NIF, uma hora que o
      # prerender.py não lê, um termo proibido); o resto fica nas anotações e no
      # resumo da corrida. O que o painel grava já passou por estas regras: isto
      # é para o que chega por outro lado (um commit à mão, o Pages CMS).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conferir o conteúdo
        run: node .github/guardas.mjs --relatorio-em "$RUNNER_TEMP/guarda.json"

      # Se o cliente escreveu no backoffice alguma coisa que não pode ir para um
      # site com o nome e a morada da empresa, a publicação falha aqui (o HTML
      # para os motores de busca e o cartão de partilha ficam como estavam). As
      # regras da guarda já os procuram, traduzidas deste script; este continua
      # a ser a última palavra.
      - name: Verificar termos proibidos
        run: python3 .github/scripts/termos.py

      # Um CSS partido não dá erro nenhum no browser: a regra é descartada em
      # silêncio e o site sai torto. Já aconteceu duas vezes — um bloco sem
      # selector e um comentário sem abertura.
      - name: Verificar a sanidade do CSS
        run: python3 .github/scripts/css_sao.py

      # Um comentário HTML que leve a sintaxe de comentário no corpo fecha-se a
      # meio, e o resto do texto passa a aparecer na página. Não dá erro nenhum:
      # o HTML é válido. Já foi para produção uma vez, com cinco parágrafos de
      # notas internas à vista no topo do site.
      - name: Verificar os comentários do HTML
        run: python3 .github/scripts/html_sao.py

      - name: Instalar o Pillow
        run: python3 -m pip install --quiet --disable-pip-version-check Pillow

      - name: Instalar o Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Converter as fotografias novas para WebP
        run: python3 .github/scripts/webp.py

      - name: Cartão de partilha (WhatsApp e Facebook)
        run: python3 .github/scripts/og.py

      - name: Medir as dimensões das imagens
        run: python3 .github/scripts/dimensoes.py

      - name: Gerar o HTML estático
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 .github/scripts/prerender.py

      - name: Carimbar a versão dos assets
        run: python3 .github/scripts/versionar_assets.py

      - name: Publicar se houve alterações
        id: publicar
        run: |
          set -euo pipefail
          ALVOS="index.html legal/ sitemap.xml sitemap-imagens.xml data/_dimensoes.json assets/img"
          if git diff --quiet -- $ALVOS && [ -z "$(git status --porcelain -- $ALVOS)" ]; then
            echo "Nada a fazer — o HTML já estava em dia."
            echo "publicado=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $ALVOS
          git commit -m "Pré-render: atualiza o HTML estático a partir de data/*.json

          Gerado automaticamente depois de uma edição no backoffice.
          Sem este passo, os motores de busca continuariam a ver a versão anterior."

          # Se entrar outro push entretanto, o push simples falhava e o HTML dos
          # motores de busca ficava desactualizado sem ninguém saber. Rebase e
          # três tentativas.
          #
          # Depois de cada rebase pergunta-se aos próprios scripts se o que está
          # commitado ainda corresponde aos dados — cada um tem um modo
          # --verificar que devolve 1 quando está desactualizado. A tentativa
          # anterior comparava `HEAD@{1}`, que não é o HEAD anterior ao pull: sem
          # colisão o reflow não escreve entrada nenhuma e HEAD@{1} passava a ser
          # o PAI do commit do bot, o que dava a condição SEMPRE verdadeira
          # (regenerava tudo em todos os runs); com colisão real dava sempre falsa
          # (publicava HTML gerado a partir dos dados antigos). Perguntar aos
          # scripts não depende de semântica de reflog e testa o que importa.
          publicado=false
          for tentativa in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              if ! ( python3 .github/scripts/webp.py --verificar \
                  && python3 .github/scripts/og.py --verificar \
                  && python3 .github/scripts/dimensoes.py --verificar \
                  && CHROME_PATH="${{ steps.chrome.outputs.chrome-path }}" \
                     python3 .github/scripts/prerender.py --verificar ); then
                echo "O rebase trouxe dados novos — a regenerar."
                python3 .github/scripts/webp.py
                python3 .github/scripts/og.py
                python3 .github/scripts/dimensoes.py
                CHROME_PATH="${{ steps.chrome.outputs.chrome-path }}" \
                  python3 .github/scripts/prerender.py
                python3 .github/scripts/versionar_assets.py
                git add -A -- $ALVOS
                git commit --amend --no-edit || true
              fi
            fi
            if git push; then publicado=true; break; fi
            echo "Tentativa $tentativa falhou; a repetir."
            sleep $((tentativa * 5))
          done
          echo "publicado=$publicado" >> "$GITHUB_OUTPUT"
          if [ "$publicado" != "true" ]; then
            echo "::error::Não consegui publicar depois de 3 tentativas."
            exit 1
          fi

      # A ronda diária não deve publicar nada em silêncio: se encontrar deriva,
      # é sinal de que alguma coisa correu mal e alguém tem de olhar.
      - name: Avisar se a ronda diária encontrou deriva
        if: github.event_name == 'schedule' && steps.publicar.outputs.publicado == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = 'A ronda diária encontrou o HTML dessincronizado dos dados';
            const abertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'prerender',
            });
            if (abertas.data.some(i => i.title === titulo)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titulo,
              labels: ['prerender'],
              body: [
                'A verificação diária regenerou o HTML estático, o que significa que',
                'estava a servir conteúdo diferente do que está em `data/*.json`.',
                '',
                'Já foi corrigido e publicado por esta execução — isto é só o aviso',
                'de que houve uma edição que não disparou o workflow na altura.',
                '',
                `Execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
